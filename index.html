<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts are third-party; open the connections early so the swap happens sooner. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

    <!--
      Everything between the seo markers is replaced per route by
      scripts/prerender.mjs at build time. The values below are the home-page
      defaults and are what the dev server serves.
      Source of truth: seo.ts
    -->
    <!--seo-start-->
    <title>LeanStart Africa | African Venture Builder</title>
    <meta name="description" content="LeanStart Africa builds Hali, Blotmarked, Ukoo Yangu and Seedfund Africa: digital products designed around African realities from day one.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="https://leanstart.africa/">
    <!--seo-end-->

    <!-- Icons and manifest are identical on every route, so they live outside the markers. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="/src/index.css">
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
